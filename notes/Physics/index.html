<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standing Wave Simulator</title>
    <style>
        
        
        #canvas {
            display: block;
            margin: 0 auto;
        }
        
      
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="harmonic">Harmonic Number (n)</label>
                <input type="range" id="harmonic" min="1" max="10" value="1" step="1">
                <div class="value-display" id="harmonicValue">1</div>
            </div>
            <div class="control-group">
                <label for="amplitude">Amplitude</label>
                <input type="range" id="amplitude" min="0.1" max="2" value="1" step="0.1">
                <div class="value-display" id="amplitudeValue">1.0</div>
            </div>
            <div class="control-group">
                <label for="length">String Length</label>
                <input type="range" id="length" min="200" max="600" value="400" step="20">
                <div class="value-display" id="lengthValue">400px</div>
            </div>
            <div class="control-group">
                <label for="speed">Animation Speed</label>
                <input type="range" id="speed" min="0.1" max="3" value="1" step="0.1">
                <div class="value-display" id="speedValue">1.0x</div>
            </div>
            <button id="playPause" class="play-btn">▶ Play</button>
        </div>
        
        <canvas id="canvas" width="800" height="400"></canvas>
        
        <div class="info">
            <strong>Wavelength:</strong> <span id="wavelengthInfo"></span> | 
            <strong>Frequency:</strong> <span id="frequencyInfo"></span> | 
            <strong>Nodes:</strong> <span id="nodesInfo"></span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let isPlaying = false;
        let time = 0;
        let animationId;
        
        // Get controls
        const harmonicSlider = document.getElementById('harmonic');
        const amplitudeSlider = document.getElementById('amplitude');
        const lengthSlider = document.getElementById('length');
        const speedSlider = document.getElementById('speed');
        const playPauseBtn = document.getElementById('playPause');
        
        // Value displays
        const harmonicValue = document.getElementById('harmonicValue');
        const amplitudeValue = document.getElementById('amplitudeValue');
        const lengthValue = document.getElementById('lengthValue');
        const speedValue = document.getElementById('speedValue');
        
        // Info displays
        const wavelengthInfo = document.getElementById('wavelengthInfo');
        const frequencyInfo = document.getElementById('frequencyInfo');
        const nodesInfo = document.getElementById('nodesInfo');
        
        // Update value displays
        function updateValueDisplays() {
            harmonicValue.textContent = harmonicSlider.value;
            amplitudeValue.textContent = parseFloat(amplitudeSlider.value).toFixed(1);
            lengthValue.textContent = lengthSlider.value + 'px';
            speedValue.textContent = parseFloat(speedSlider.value).toFixed(1) + 'x';
            
            const n = parseInt(harmonicSlider.value);
            const L = parseInt(lengthSlider.value);
            const wavelength = (2 * L) / n;
            const frequency = n; // Relative frequency
            const nodes = n + 1;
            
            wavelengthInfo.textContent = wavelength.toFixed(1) + 'px';
            frequencyInfo.textContent = frequency + ' × f₁';
            nodesInfo.textContent = nodes;
        }
        
        // Draw the standing wave
        function drawWave() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const n = parseInt(harmonicSlider.value);
            const amplitude = parseFloat(amplitudeSlider.value);
            const stringLength = parseInt(lengthSlider.value);
            const speed = parseFloat(speedSlider.value);
            
            // Calculate positions
            const startX = (canvas.width - stringLength) / 2;
            const centerY = canvas.height / 2;
            const maxAmplitude = 80;
            
            // Draw fixed ends
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(startX, centerY, 8, 0, 2 * Math.PI);
            ctx.beginPath();
            ctx.arc(startX + stringLength, centerY, 8, 0, 2 * Math.PI);
            
            // Draw the standing wave
            ctx.strokeStyle = 'blue';
            ctx.lineWidth = 3;
            ctx.beginPath();
            
            for (let x = 0; x <= stringLength; x += 2) {
                // Standing wave equation: y(x,t) = A * sin(nπx/L) * cos(ωt)
                const normalizedX = x / stringLength; // x/L
                const spatialPart = Math.sin(n * Math.PI * normalizedX);
                const temporalPart = Math.cos(time * speed);
                const y = amplitude * maxAmplitude * spatialPart * temporalPart;
                
                if (x === 0) {
                    ctx.moveTo(startX + x, centerY + y);
                } else {
                    ctx.lineTo(startX + x, centerY + y);
                }
            }
            ctx.stroke();
            
            // Draw nodes
            ctx.fillStyle = 'red';
            for (let i = 0; i <= n; i++) {
                const nodeX = startX + (i * stringLength) / n;
                ctx.beginPath();
                ctx.arc(nodeX, centerY, 4, 0, 2 * Math.PI);
                ctx.fill();
            }
            
            // Draw antinodes (only if not at the ends)
            ctx.fillStyle = 'blue';
            for (let i = 1; i < n; i += 2) {
                const antinodeX = startX + ((i * stringLength) / n) + (stringLength / (2 * n));
                if (antinodeX < startX + stringLength) {
                    ctx.beginPath();
                    ctx.arc(antinodeX, centerY, 4, 0, 2 * Math.PI);
                    ctx.fill();
                }
            }
            
            
            // Draw harmonic info
            ctx.font = '16px Arial';
            ctx.fillText(`Harmonic n = ${n}`, 20, 30);
        }
        
        // Animation loop
        function animate() {
            if (isPlaying) {
                time += 0.05;
                drawWave();
                animationId = requestAnimationFrame(animate);
            }
        }
        
        // Event listeners
        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playPauseBtn.textContent = '⏸ Pause';
                playPauseBtn.classList.add('pause');
                animate();
            } else {
                playPauseBtn.textContent = '▶ Play';
                playPauseBtn.classList.remove('pause');
                cancelAnimationFrame(animationId);
            }
        });
        
        // Update displays when sliders change
        [harmonicSlider, amplitudeSlider, lengthSlider, speedSlider].forEach(slider => {
            slider.addEventListener('input', () => {
                updateValueDisplays();
                drawWave();
            });
        });
        
        // Initial setup
        updateValueDisplays();
        drawWave();

        // auto start animation
        playPauseBtn.click();
    </script>
</body>
</html>
